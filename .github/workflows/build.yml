name: Build TownyReborn fork

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew clean build --stacktrace

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: LyttleNametag-Paper-26.2
          path: build/libs/LyttleNametag-*.jar
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.4.0-townyreborn.4
          JAR: build/libs/LyttleNametag-1.4.0-townyreborn.4.jar
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --title "LyttleNametag 1.4.0-townyreborn.4" \
              --generate-notes
          fi
