# ###################################################
#            Lyttle Nametag - config.yml            #
# ###################################################
# This file contains the configuration for the Lyttle Nametag plugin.
# You can customize the nametag format and other settings.
#
# ⚠️ Do NOT remove any keys — the plugin depends on them.
# You are free to customize the text and formatting.
# ###################################################

# nametag
# LuckPerms prefixes are parsed as MiniMessage components. You can paste a
# Birdflop prefix such as <gradient:#ff4fa3:#55ff55><bold>OWNER</bold></gradient>
# directly into LuckPerms and use <luckperms_prefix> here.
nametag: |-
  <luckperms_prefix>
  <white><player></white>
  <red>❤</red> <white><health></white><dark_gray>/<max_health></dark_gray>

# Interval in seconds for checking updates.
interval: 0.5

# The maximum distance at which the nametag will be visible. (In blocks) (default: 64)
view_distance: 64

# Vertical distance between nametag lines in blocks.
line_spacing: 0.275

# Hide Minecraft's original player nametag so it does not overlap the custom
# rank, name and health lines. Citizens NPCs are ignored.
hide_vanilla_nametag: true

# ⚠️ Do not change this value.
config_version: 5
